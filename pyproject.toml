[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demgen"
version = "1.1.0"
description = "A standardized particle packing generator for the Discrete Element Method"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Chengshun Shang", email = "cshang@cimne.upc.edu" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pyevtk",
]

[project.scripts]
demgen = "demgen.DEMGen_framework_main:main"

[tool.setuptools]
package-dir = { demgen = "src" }
packages = [
    "demgen",
    "demgen.constructive_methods",
    "demgen.data_processing",
    "demgen.data_processing.post_processing",
    "demgen.data_processing.pre_processing",
    "demgen.dynamic_methods",
]
include-package-data = true

[tool.setuptools.package-data]
demgen = [
    "data_processing/post_processing/packing_characterization_run.py",
    "utilities/*.py",
    "utilities/rem_seed_files/*",
]
